name: Deploy to Ubuntu VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Jar with Maven
        run: mvn clean package -DskipTests

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy JAR and Restart Service
        run: |
          # Copy compiled JAR file directly via native SCP
          scp -P ${{ secrets.VPS_PORT || 22 }} target/milkdelivery-0.0.1-SNAPSHOT.jar ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}/milkdelivery-0.0.1-SNAPSHOT.jar

          # Create production environment variables file on server
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            mkdir -p ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}
            cat << 'EOF' > ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}/app.env
          DB_HOST=${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_NAME=${{ secrets.DB_NAME || 'smart_milk_delivery' }}
          DB_USER=${{ secrets.DB_USER || 'root' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD || 'root' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'smart_milk_delivery_super_secret_jwt_key_2026_very_long_string' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN || 'mock_telegram_bot_token' }}
          TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME || 'mock_telegram_bot_username' }}
          EOF
            sudo systemctl restart smart-milk-delivery || sudo systemctl start smart-milk-delivery
          "
