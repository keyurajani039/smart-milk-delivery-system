name: Deploy to Ubuntu VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Jar with Maven
        run: mvn clean package -DskipTests

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy JAR and Restart Service
        run: |
          # Copy compiled JAR file directly via native SCP
          scp -P ${{ secrets.VPS_PORT || 22 }} target/milkdelivery-0.0.1-SNAPSHOT.jar ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}/milkdelivery-0.0.1-SNAPSHOT.jar

          # Execute SSH commands to restart service
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            if systemctl is-active --quiet smart-milk-delivery; then
              echo 'Restarting smart-milk-delivery systemd service...'
              sudo systemctl restart smart-milk-delivery
            else
              echo 'Starting application with nohup...'
              cd ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}
              pkill -f 'milkdelivery-0.0.1-SNAPSHOT.jar' || true
              nohup java -jar milkdelivery-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            fi
          "
