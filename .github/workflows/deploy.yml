name: Deploy to Ubuntu VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Jar with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to Ubuntu VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "target/milkdelivery-0.0.1-SNAPSHOT.jar"
          target: ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}
          strip_components: 1

      - name: Restart Application Service on Ubuntu VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}
            if systemctl is-active --quiet smart-milk-delivery; then
              echo "Restarting smart-milk-delivery systemd service..."
              sudo systemctl restart smart-milk-delivery
            else
              echo "Starting application with nohup..."
              cd ${{ secrets.VPS_APP_DIR || '/opt/smart-milk-delivery' }}
              pkill -f 'milkdelivery-0.0.1-SNAPSHOT.jar' || true
              nohup java -jar milkdelivery-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            fi
