# Server Configuration
server.port=8081

# Spring Application Name
spring.application.name=milkdelivery

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_milk_delivery}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# SpringDoc / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Configuration
jwt.secret=${JWT_SECRET:smart_milk_delivery_super_secret_jwt_key_2026_very_long_string}

# Telegram Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:mock_telegram_bot_token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:mock_telegram_bot_username}

# Ollama / AI Configuration
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}
openai.api.key=${OPENAI_API_KEY:}

# Razorpay Configuration (Mock / Static Default)
razorpay.key.id=rzp_test_mock_key_id
razorpay.key.secret=mock_razorpay_key_secret
razorpay.webhook.secret=mock_webhook_secret

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:}
